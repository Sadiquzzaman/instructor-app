# Flutter's gen-l10n: generates lib/l10n/generated/ from the ARB files.
# The ARB files are themselves generated by tool/import_web_messages.dart.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n/generated
nullable-getter: false
format: true
