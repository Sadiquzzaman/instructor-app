# Android test builds (HANDOVER §7, STAGE-0-PLAN.md §10).
# - Every merge into develop: a release APK signed with the test key, published
#   as a GitHub pre-release that testers download and install.
# - Pull requests that touch the Android build: the same signed build, checked
#   but not published.
# The test key lives only in the Actions secrets; it is written to the runner's
# temporary folder for the build and deleted afterwards.
name: Android pre-release

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    paths:
      - android/**
      - pubspec.yaml
      - .github/workflows/android-prerelease.yml

permissions:
  contents: read

concurrency:
  group: android-prerelease-${{ github.ref }}
  cancel-in-progress: false

env:
  # SHA-256 fingerprint of the test signing certificate (public, not a secret).
  TEST_CERT_SHA256: daf46538e87134120e0918517371c5ae877684d85ac5ad34a991123744c59f8a

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal build takes 2–4 minutes; fail fast instead of hanging on a stuck download.
    timeout-minutes: 15
    permissions:
      contents: write # to create the pre-release on pushes to develop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get

      # The NDK (~700 MB) is not on GitHub's runners in the version Flutter
      # needs, and Google's download can be very slow (24 minutes and a broken
      # zip on 17 Nov). Keep it, and Gradle's downloads, in the Actions cache.
      - name: NDK version Flutter uses
        id: ndk
        run: |
          version=$(sed -n 's/.*val ndkVersion: String = "\([0-9.]*\)".*/\1/p' \
            "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")
          if [ -z "$version" ]; then echo "::error::Could not read Flutter's NDK version."; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "path=$ANDROID_HOME/ndk/$version" >> "$GITHUB_OUTPUT"

      - name: Restore the NDK
        id: ndk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ndk.outputs.path }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}

      - name: Install the NDK (first time only)
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          for attempt in 1 2 3; do
            if timeout 180 "$sdkmanager" --install "ndk;${{ steps.ndk.outputs.version }}" > /dev/null; then
              echo "NDK installed (attempt $attempt)."; exit 0
            fi
            echo "::warning::NDK download attempt $attempt failed or took over 3 minutes; retrying."
            rm -rf "${{ steps.ndk.outputs.path }}"
          done
          echo "::error::Could not download the NDK after 3 attempts."; exit 1

      - name: Restore Gradle's downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Write the test signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/test-signing.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/test-signing.p12" >> "$GITHUB_ENV"

      - name: Version
        id: version
        run: |
          name=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=APP_ENV=beta

      - name: Check it is signed with the test key
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk > certs.txt
          grep -q "certificate SHA-256 digest: $TEST_CERT_SHA256" certs.txt || {
            echo "::error::The APK is not signed with the test key."
            exit 1
          }
          echo "Signed with the test key."

      - name: Publish the pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="instructor-${{ steps.version.outputs.tag }}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$apk"
          gh release create "${{ steps.version.outputs.tag }}" "$apk" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Instructor ${{ steps.version.outputs.name }} test build ${{ github.run_number }}" \
            --notes "Test build from develop (${{ github.sha }}), talking to beta. Install the APK on an Android 7.0+ phone (allow installing unknown apps); it installs over earlier test builds." \
            --generate-notes

      - name: Delete the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/test-signing.p12" certs.txt
