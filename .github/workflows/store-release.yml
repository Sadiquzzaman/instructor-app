# Store build for Google Play (docs/RELEASING.md).
# Run by hand from the Actions tab on `main`. It builds an Android App Bundle
# (.aab) signed with the Play upload key from the Actions secrets and keeps it
# as a download on the run for 30 days. It uploads nothing to Play.
#
# Which server it talks to comes from the repository variable APP_ENV
# (Settings → Secrets and variables → Actions → Variables). Without it the
# build talks to beta. Set it to `production` only when the owner says
# production is live.
name: Store release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-release
  cancel-in-progress: false

env:
  APP_ENV: ${{ vars.APP_ENV || 'beta' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get

      # The same NDK and Gradle caches as the test builds (android-prerelease.yml).
      - name: NDK version Flutter uses
        id: ndk
        run: |
          version=$(sed -n 's/.*val ndkVersion: String = "\([0-9.]*\)".*/\1/p' \
            "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")
          if [ -z "$version" ]; then echo "::error::Could not read Flutter's NDK version."; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "path=$ANDROID_HOME/ndk/$version" >> "$GITHUB_OUTPUT"

      - name: Restore the NDK
        id: ndk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ndk.outputs.path }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}

      - name: Install the NDK (first time only)
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          timeout 300 "$sdkmanager" --install "ndk;${{ steps.ndk.outputs.version }}" > /dev/null

      - name: Restore Gradle's downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Write the upload key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_UPLOAD_KEYSTORE_BASE64 secret is missing (docs/RELEASING.md, step 2)."
            exit 1
          fi
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"

      # Play needs a larger version code for every upload. Test APKs use the
      # pre-release run number (100s); store builds start at 10000.
      - name: Version
        id: version
        run: |
          echo "code=$((10000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
          echo "Server: $APP_ENV"

      - name: Build the app bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: >-
          flutter build appbundle --release
          --build-number=${{ steps.version.outputs.code }}
          --dart-define=APP_ENV=${{ env.APP_ENV }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instructor-${{ env.APP_ENV }}-${{ steps.version.outputs.code }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Delete the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"
